<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOLK</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }
        h1 {
            font-size: 72px;
            text-transform: uppercase;
            margin: 0;
            color: #000000;
            cursor: pointer;
        }

        #cursor-gif {
            position: fixed;
            pointer-events: none; 
            display: none;
            z-index: 9999;
            transform: translate(15px, 15px); 
            max-width: 150px; 
        }
    </style>
</head>
<body>

    <h1 id="folk-text">FOLK</h1>
    <img id="cursor-gif" src="img/200w.gif" alt="Preview GIF">

    <script>
        const folkText = document.getElementById('folk-text');
        const cursorGif = document.getElementById('cursor-gif');

        folkText.addEventListener('mouseenter', () => {
            cursorGif.style.display = 'block';
        });

        folkText.addEventListener('mousemove', (e) => {
            cursorGif.style.left = e.clientX + 'px';
            cursorGif.style.top = e.clientY + 'px';
        });

        folkText.addEventListener('mouseleave', () => {
            cursorGif.style.display = 'none';
        });
    </script>
</body>
</html>
